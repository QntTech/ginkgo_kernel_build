name: Patch services.jar (disable VibratorManagerService.Lifecycle)
# Kullanim:
# 1) Bu dosyayi reponda .github/workflows/patch-services-jar.yml olarak kaydet.
# 2) services.jar dosyani 7-Zip ile LZ4 sikistir (services.jar.lz4 olacak)
#    ve repo kokune koy (25MB GitHub web-upload sinirini asmamak icin).
# 3) GitHub'da Actions sekmesinden bu workflow'u "Run workflow" ile elle tetikle.
# 4) Is bitince Actions calistirmasinin altindaki "Artifacts" bolumunden
#    patched-services-jar.zip dosyasini indir, icinden services.jar'i cikar.
#
# Not: Eger dogrudan sikistirilmamis services.jar da repo kokunde varsa
# (25MB alti kucuk bir jar test ediyorsan), workflow onu da kabul eder;
# .lz4 dosyasi varsa oncelik ona verilir.
#
# DEGISIKLIK GECMISI:
# - smali/baksmali artik kaynaktan derlenmiyor; JesusFreke/smali v2.5.2
#   yeni Android surumlerinin urettigi dex formatlarini (ornegin dex 041)
#   TANIMIYOR ve "Dex version 041 is not supported" hatasi veriyordu.
#   Bunun yerine, bu projeyi surduren google/smali fork'unun (com.android.tools.smali)
#   guncel, onceden derlenmis fat-jar'lari (v3.0.9) doğrudan indiriliyor.
#   Bu jarlar guncel dex surumlerini destekler ve CLI komutlari
#   (disassemble/assemble) ayni kaldigi icin workflow'un geri kalani degismedi.
# - services.jar multidex olabilecegi (classes.dex, classes2.dex, classes3.dex...)
#   icin artik TUM dex dosyalari taraniyor, SystemServer.smali hangisinde
#   bulunursa SADECE o dex patchlenip geri paketleniyor.
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: lz4 araclarini kur
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lz4

      - name: services.jar.lz4 var mi kontrol et ve ayikla
        run: |
          set -e
          if [ -f services.jar.lz4 ]; then
            echo "services.jar.lz4 bulundu, aciliyor..."
            # 7-Zip'in urettigi .lz4 genelde ham LZ4 frame formatidir.
            # Standart 'lz4' CLI araciyla acmayi dene.
            if lz4 -d -f services.jar.lz4 services.jar 2>err.log; then
              echo "lz4 ile basariyla acildi."
            else
              echo "UYARI: standart 'lz4 -d' basarisiz oldu, log:"
              cat err.log
              echo "Alternatif olarak 7z ile deneniyor..."
              sudo apt-get install -y p7zip-full
              7z x services.jar.lz4 -y
              # 7z bazen .lz4 uzantisini kaldirip ayni isimli dosya uretir
              if [ ! -f services.jar ]; then
                FOUND=$(find . -maxdepth 1 -newer services.jar.lz4 -name "services*" ! -name "*.lz4" | head -n1)
                if [ -n "$FOUND" ]; then
                  mv "$FOUND" services.jar
                fi
              fi
            fi
          elif [ -f services.jar ]; then
            echo "services.jar.lz4 yok ama services.jar zaten mevcut, onu kullaniyorum."
          else
            echo "HATA: repo kokunde ne services.jar.lz4 ne de services.jar bulunamadi." >&2
            exit 1
          fi
          if [ ! -f services.jar ]; then
            echo "HATA: services.jar acildiktan sonra da bulunamadi." >&2
            exit 1
          fi
          ls -la services.jar
          file services.jar

      - name: smali/baksmali hazir jarlarini indir (v3.0.9 - guncel dex surumlerini destekler)
        run: |
          set -e
          mkdir -p tools
          SMALI_VER="3.0.9"
          BASE_URL="https://github.com/baksmali/smali/releases/download/${SMALI_VER}"
          curl -fL -o tools/baksmali.jar "${BASE_URL}/baksmali-${SMALI_VER}-fat.jar"
          curl -fL -o tools/smali.jar "${BASE_URL}/smali-${SMALI_VER}-fat.jar"
          echo "----- Sonuc -----"
          ls -la tools
          file tools/*.jar
          echo "----- Hizli fonksiyon testi -----"
          java -jar tools/baksmali.jar --version
          java -jar tools/smali.jar --version

      - name: classes*.dex cikar (multidex destekli)
        run: |
          set -e
          mkdir -p work
          cp services.jar work/services.jar
          cd work
          unzip -o services.jar -d extracted
          echo "----- Bulunan dex dosyalari -----"
          find extracted -maxdepth 1 -iname "classes*.dex" | sort

      - name: Her dex icin baksmali calistir (SystemServer.smali'yi bul)
        run: |
          set -e
          cd work
          mkdir -p smali_out
          FOUND_DEX=""
          for dexfile in extracted/classes*.dex; do
            [ -e "$dexfile" ] || continue
            base=$(basename "$dexfile" .dex)
            outdir="smali_out/$base"
            echo "===== Disassemble: $dexfile -> $outdir ====="
            java -jar ../tools/baksmali.jar disassemble "$dexfile" -o "$outdir"
            if find "$outdir" -iname "SystemServer.smali" | grep -q .; then
              echo "SystemServer.smali bulundu: $dexfile"
              FOUND_DEX="$base"
            fi
          done
          if [ -z "$FOUND_DEX" ]; then
            echo "HATA: SystemServer.smali hicbir dex'te bulunamadi." >&2
            exit 1
          fi
          echo "$FOUND_DEX" > found_dex.txt
          echo "Patchlenecek dex: $FOUND_DEX"

      - name: SystemServer.smali icinde VibratorManagerService cagrisini patchle
        run: |
          set -e
          cd work
          FOUND_DEX=$(cat found_dex.txt)
          FILE=$(find "smali_out/$FOUND_DEX" -iname "SystemServer.smali" | head -n1)
          if [ -z "$FILE" ]; then
            echo "HATA: SystemServer.smali bulunamadi." >&2
            exit 1
          fi
          echo "Bulunan dosya: $FILE"
          cp "$FILE" "$FILE.bak"
          python3 - "$FILE" << 'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          # VibratorManagerService$Lifecycle sinifini startService(...) ile
          # baslatan cagriyi iceren blogu bul ve no-op yap (yorum satirina cevir).
          m = re.search(r'L[\w/$]*VibratorManagerService\$Lifecycle;', content)
          if not m:
              print("UYARI: VibratorManagerService$Lifecycle referansi bulunamadi. "
                    "Manuel inceleme gerekebilir.")
              sys.exit(0)
          class_ref = m.group(0)
          print(f"Bulunan sinif referansi: {class_ref}")
          lines = content.split("\n")
          out = []
          i = 0
          patched = False
          while i < len(lines):
              line = lines[i]
              if class_ref in line and "const-class" in line:
                  reg_match = re.search(r'const-class\s+(v\d+|p\d+),', line)
                  target_reg = reg_match.group(1) if reg_match else None
                  block_start = i
                  block_end = i
                  found_invoke = False
                  j = i
                  while j < min(i + 6, len(lines)):
                      if "startService(" in lines[j] and "invoke-" in lines[j]:
                          block_end = j
                          found_invoke = True
                          break
                      j += 1
                  if found_invoke:
                      print(f"Patchleniyor: satir {block_start+1} - {block_end+1}")
                      out.append(f"    # >>> PATCHED: VibratorManagerService.Lifecycle baslatma cagrisi devre disi birakildi")
                      for k in range(block_start, block_end + 1):
                          out.append(f"    # {lines[k]}")
                      out.append(f"    # <<< PATCHED")
                      i = block_end + 1
                      patched = True
                      continue
              out.append(line)
              i += 1
          if not patched:
              print("UYARI: startService cagrisi otomatik olarak eslesmedi. "
                    "SystemServer.smali'yi elle incelemen gerekebilir "
                    "(bak: SystemServer.smali.bak).")
          else:
              with open(path, "w", encoding="utf-8") as f:
                  f.write("\n".join(out))
              print("Patch basariyla uygulandi.")
          PYEOF
          echo "----- Degisiklik ozeti (diff) -----"
          diff "$FILE.bak" "$FILE" || true
          echo "----- VibratorManagerService gecen tum satirlar (kontrol icin) -----"
          grep -n "VibratorManagerService" "$FILE.bak" || echo "(hic gecmiyor - class adi farkli olabilir)"

      - name: Sadece patchlenen dex'i smali ile yeniden derle
        run: |
          set -e
          cd work
          FOUND_DEX=$(cat found_dex.txt)
          java -jar ../tools/smali.jar assemble "smali_out/$FOUND_DEX" -o "extracted/${FOUND_DEX}.dex"
          ls -la "extracted/${FOUND_DEX}.dex"

      - name: Patchlenmis dex ile services.jar'i yeniden paketle
        run: |
          cd work
          cd extracted
          zip -r -X ../services_patched.jar . -x ".*"
          cd ..
          ls -la services_patched.jar

      - name: Patchlenmis jar'i ve smali diff'ini artifact olarak yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-services-jar
          path: |
            work/services_patched.jar
            work/smali_out/**/SystemServer.smali
            work/smali_out/**/SystemServer.smali.bak
          if-no-files-found: warn

      - name: Sadece SystemServer.smali'yi ayrica yukle (patch otomatik tutmazsa manuel bakman icin)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SystemServer-smali-raw
          path: work/smali_out/**/SystemServer.smali*
          if-no-files-found: warn
