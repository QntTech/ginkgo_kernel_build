name: Build Ginkgo Kernel (Floppy base, prod - debug removed)

# Elindeki çalışan kernel Floppy Kernel (flopster101), kaynağı:
#   https://github.com/FlopKernel-Series/flop_trinket-mi_kernel  (branch: floppy-unity)
# Bu repo kendi build script'ini içeriyor: do_build.sh
# Kendi make komutlarımızı tahmin etmek yerine BU script'i çalıştırıyoruz,
# çünkü doğru defconfig/toolchain/flag seçimini zaten biliyor.
#
# ============================================================================
# v5 (bu revizyon): DEBUG BRING-UP KALDIRILDI
# ============================================================================
# v1-v4'te eklenen UART/earlycon debug bloğu artık gereksiz (UART sorunu
# çözüldü) ve gerçek performans maliyeti var. Kaynak deposu (trinket-perf_
# defconfig) incelendi; base'te zaten şunlar açık/kapalı geliyor:
#   - CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y, ThinLTO açık
#   - CONFIG_SLUB_DEBUG / KASAN / SCHEDSTATS / DETECT_HUNG_TASK / lock-debug: kapalı
#   - CONFIG_SERIAL_MSM_GENI_CONSOLE / SERIAL_EARLYCON / EARLY_PRINTK: kapalı
#   - CONFIG_DYNAMIC_DEBUG: kapalı, CONFIG_LOG_BUF_SHIFT=20, LOGLEVEL_DEFAULT=7
#   - CONFIG_PANIC_TIMEOUT=2 (gerçek bir panic'te 2sn sonra reboot atar)
# Yani base defconfig zaten performans için ayarlanmış durumda; bizim v1'de
# eklediğimiz debug bloğu bunun ÜZERİNE ekstra maliyet bindiriyordu:
#   - Konsolu UART'a açmak (SERIAL_MSM_GENI_CONSOLE/EARLYCON/EARLY_PRINTK)
#     + "ignore_loglevel debug initcall_debug" cmdline flag'leri: her kernel
#     mesajını 115200 baud seri porta senkron yazdırıyordu (asıl boot
#     yavaşlamasının kaynağı muhtemelen bu).
#   - LOG_BUF_SHIFT 20->21, CONSOLE_LOGLEVEL_DEFAULT 7->15,
#     MESSAGE_LOGLEVEL_DEFAULT 4->7, DYNAMIC_DEBUG açılması: ekstra log
#     üretimi + bellek.
#   - PANIC_TIMEOUT 2->0, PANIC_ON_OOPS zorla kapatılması, HARDLOCKUP/
#     SOFTLOCKUP_PANIC=n: bring-up sırasında "panic olunca dursun,
#     incelensin" içindi - üretimde tam tersi istenir (gerçek bir panic'te
#     cihaz kendini toplayıp reboot atmalı), bu yüzden kaldırıldı.
#
# BONUS FIX: v1-v4'teki CONFIG_CMDLINE tamamen string override yaptığı için
# base defconfig'in "cgroup_disable=pressure" parametresini (PSI accounting
# maliyetini azaltan gerçek bir optimizasyon) sessizce siliyordu. v5'te geri
# eklendi.
#
# KORUNANLAR (debug değil, işlevsel fix - dokunulmadı):
#   - CONFIG_SECURITY_SELINUX_BOOTPARAM=y + VALUE=0: başlangıç durumu permissive.
#   - sel_write_enforce() source patch: init'in setenforce(1) çağrısını
#     etkisiz kılıyor (OneUI/A35 prebuilt init enforcing'e zorluyordu).
#   - CONFIG_FAKE_UNAME_5_10=y: netbpfload'un ">=5.10" kernel şartını geçmek için.
#   - bpf_spoof "== 1" karşılaştırmasını kaynakta nötrleyen patch: cmdline'daki
#     uname_bpf_spoof=2 değerini bootloader'ın sabit "=1"i eziyordu (aynı
#     parametre iki kez geçince kernel sonuncusunu kullanıyor), bu yüzden
#     "partial mode"u tetikleyen karşılaştırma kaynakta hep yanlış olacak
#     şekilde patch'lendi -> her zaman "full mode" (netd + uprobestats dahil).
#   - com.android.tethering.apex sistemde kalmaya devam ediyor (netbpfload
#     BPF programlarını gerçekten yüklesin diye, netd crashloop'unu önlemek için).
#
# Mevcut sonuç: kernel işlevsel olarak v4 ile birebir aynı davranıyor
# (SELinux permissive + tam bpf spoof), sadece debug/log/console overhead'i
# kaldırılmış oldu.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel kaynak reposu"
        required: true
        default: "FlopKernel-Series/flop_trinket-mi_kernel"
      kernel_branch:
        description: "Branch"
        required: true
        default: "floppy-unity"
      anykernel_repo:
        description: "Trinket'e özel AnyKernel3 şablonu"
        required: true
        default: "FlopKernel-Series/AnyKernel3-trinket"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential python3 python3-pip \
            git curl zip unzip device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            lld llvm clang

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" \
            "https://github.com/${{ github.event.inputs.kernel_repo }}.git" kernel
          cd kernel && git log -1 --oneline
          echo "--- do_build.sh içeriği ---"
          cat do_build.sh || echo "do_build.sh bulunamadı, dosya listesi:"
          ls -la

      # v5: SADECE işlevsel gereksinimler ekleniyor - UART/earlycon/pstore/
      # loglevel/panic-timeout debug bloğu tamamen kaldırıldı.
      - name: Apply required boot config (SELinux permissive + bpf spoof, no debug)
        working-directory: kernel
        run: |
          # Doğrulandı: gerçek defconfig fragmanı arch/arm64/configs/vendor/ginkgo.config
          # (ckbuild.sh: DEFAULT_DEFCONFIG=vendor/trinket-perf_defconfig,
          #  GINKGO_FRAGMENT=vendor/ginkgo.config üstüne merge ediliyor)
          DEFCONFIG_PATH="arch/arm64/configs/vendor/ginkgo.config"
          echo "İşlevsel config eklenecek dosya: $DEFCONFIG_PATH"

          cat >> "$DEFCONFIG_PATH" << 'EOF'

          # ---- SELinux: başlangıç durumu permissive (asıl zorlama kaynak
          #      patch'inde - bkz. sonraki step) ----
          CONFIG_SECURITY_SELINUX_BOOTPARAM=y
          CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0

          # ---- netbpfload/netd BPF kernel-sürüm kontrolünü geçmek ----
          # Base defconfig'de FAKE_UNAME_5_4 seçili, Android 16 "25Q4"
          # netbpfload build'i >=5.10 istiyor - 5.10'a yükseltiyoruz.
          # CONFIG_FAKE_UNAME_5_4 is not set
          CONFIG_FAKE_UNAME_5_10=y

          # ---- cmdline: debug flag'leri YOK. cgroup_disable=pressure geri
          # eklendi (base defconfig'de vardı, v1-v4'te CONFIG_CMDLINE tam
          # string override olduğu için sessizce kayboluyordu). Kernel
          # kendi kararını (full bpf spoof mode) source patch ile zaten
          # dayattığı için "uname_bpf_spoof=2" burada kozmetik/belgeleyici
          # amaçlı bırakıldı, zararı yok.
          CONFIG_CMDLINE="cgroup_disable=pressure androidboot.selinux=permissive uname_bpf_spoof=2"
          CONFIG_CMDLINE_EXTEND=y
          EOF
          echo "Config eklendi, son 20 satır:"
          tail -20 "$DEFCONFIG_PATH"

      # DEĞİŞMEDİ (v2'den beri): init'in setenforce(1) çağrısını kernel
      # seviyesinde etkisiz hale getiriyoruz. sel_write_enforce()
      # /sys/fs/selinux/enforce yazma işleyicisidir; userspace'ten gelen
      # değeri okuduktan hemen sonra 0'a sabitliyoruz, böylece init
      # "enforcing'e geçtim" sanır ama selinux_enforcing hep 0 kalır.
      # AVC denied'lar loglanmaya devam eder (audit_log çağrısı dokunulmadan
      # kalıyor), sadece artık gerçek bir engelleme/EACCES üretmiyorlar.
      - name: Patch sel_write_enforce() to ignore userspace enforcing requests
        working-directory: kernel
        run: |
          set -eu
          SELINUXFS="security/selinux/selinuxfs.c"
          if [ ! -f "$SELINUXFS" ]; then
            echo "::error::$SELINUXFS bulunamadı, kernel ağacı beklenenden farklı yapıda olabilir."
            find . -name "selinuxfs.c" -not -path "./.git/*"
            exit 1
          fi

          if grep -q "FORCE PERMISSIVE PATCH" "$SELINUXFS"; then
            echo "Zaten patch'lenmiş, tekrar patch'lemiyorum."
            exit 0
          fi

          echo "=== sel_write_enforce - patch öncesi (satır numaralı) ==="
          grep -n "sel_write_enforce" "$SELINUXFS"
          FUNC_START=$(grep -n "^static ssize_t sel_write_enforce" "$SELINUXFS" | head -1 | cut -d: -f1)
          if [ -z "$FUNC_START" ]; then
            echo "::error::sel_write_enforce fonksiyon başlangıcı bulunamadı, dosya yapısı beklenenden farklı."
            grep -n "write_enforce\|sscanf" "$SELINUXFS" || true
            exit 1
          fi
          echo "Fonksiyon $FUNC_START. satırda başlıyor, sonraki 40 satır:"
          sed -n "${FUNC_START},$((FUNC_START+40))p" "$SELINUXFS"

          SSCANF_LINE=$(awk -v start="$FUNC_START" -v end="$((FUNC_START+60))" \
            'NR>=start && NR<=end && /sscanf/ {print NR; exit}' "$SELINUXFS")
          if [ -z "$SSCANF_LINE" ]; then
            echo "::error::sscanf satırı sel_write_enforce içinde bulunamadı."
            exit 1
          fi
          echo "sscanf çağrısı $SSCANF_LINE. satırda bulundu:"
          sed -n "${SSCANF_LINE}p" "$SELINUXFS"

          INSERT_AFTER=$(awk -v s="$SSCANF_LINE" -v end="$((SSCANF_LINE+3))" \
            'NR>=s && NR<=end && /;/ {print NR; exit}' "$SELINUXFS")
          if [ -z "$INSERT_AFTER" ]; then
            echo "::error::sscanf sonrası satır bulunamadı."
            exit 1
          fi
          echo "Patch, ${INSERT_AFTER}. satırdan sonra eklenecek:"
          sed -n "${INSERT_AFTER}p" "$SELINUXFS"

          printf '\n    /* FORCE PERMISSIVE PATCH: ignore whatever userspace (init) requests,\n     * always keep the kernel in permissive mode. AVC denials are still\n     * logged below via audit_log(), they just never become blocking. */\n    new_value = 0;\n' > /tmp/selinux_patch_snippet.txt
          sed -i "${INSERT_AFTER}r /tmp/selinux_patch_snippet.txt" "$SELINUXFS"

          if ! grep -q "FORCE PERMISSIVE PATCH" "$SELINUXFS"; then
            echo "::error::Patch eklendi ama marker dosyada bulunamadı, sed başarısız olmuş olabilir."
            exit 1
          fi

          echo "=== sel_write_enforce - patch sonrası (satır numaralı) ==="
          sed -n "${FUNC_START},$((FUNC_START+45))p" "$SELINUXFS"

          echo "=== Doğrulama: new_value = 0; satırı gerçekten sscanf'ten SONRA mı? ==="
          NEWVAL_LINE=$(grep -n "new_value = 0;" "$SELINUXFS" | head -1 | cut -d: -f1)
          if [ -z "$NEWVAL_LINE" ] || [ "$NEWVAL_LINE" -le "$SSCANF_LINE" ]; then
            echo "::error::new_value = 0; satırı sscanf'ten önce ya da hiç yok - patch mantığı bozuk."
            exit 1
          fi
          echo "OK: new_value = 0; satır $NEWVAL_LINE, sscanf satır $SSCANF_LINE'den sonra - sıralama doğru."

      # DEĞİŞMEDİ (v4'ten beri): cmdline'dan "uname_bpf_spoof=2" göndermek
      # tek başına yeterli değil çünkü CONFIG_CMDLINE_EXTEND=y modunda
      # bootloader'ın kendi "uname_bpf_spoof=1"i bizimkinin ÜZERİNE yazıyor
      # (sonuncu kazanıyor). Bootloader/DTB tarafına dokunmadan çözmek için
      # "partial mode"u tetikleyen "bpf_spoof == 1" karşılaştırmasını
      # kaynakta öyle bir patch'liyoruz ki ASLA doğru olamasın (& 0
      # eklenerek) - bootloader ne cmdline değeri gönderirse göndersin,
      # kod hep "full mode"a düşer (netd ve uprobestats de spoof kapsamına girer).
      - name: Force uname_bpf_spoof full-mode regardless of cmdline value
        working-directory: kernel
        run: |
          set -eu
          echo "=== 'bpf_spoof' geçen tüm satırlar (kernel/sys.c + init/main.c) ==="
          grep -n "bpf_spoof" kernel/sys.c 2>/dev/null || echo "(kernel/sys.c içinde yok)"
          grep -n "bpf_spoof" init/main.c 2>/dev/null || echo "(init/main.c içinde yok)"

          PATCHED=0
          for f in kernel/sys.c init/main.c; do
            [ -f "$f" ] || continue

            if grep -q "BPF_SPOOF_ALWAYS_FULL_PATCH" "$f"; then
              echo "$f zaten patch'lenmiş, atlıyorum."
              PATCHED=1
              continue
            fi

            LINE=$(grep -n "bpf_spoof" "$f" | grep -E '==[[:space:]]*1\b' | head -1 | cut -d: -f1)
            if [ -z "$LINE" ]; then
              continue
            fi

            echo "=== $f satır $LINE (patch öncesi) ==="
            sed -n "$((LINE>3?LINE-3:1)),$((LINE+3))p" "$f"

            sed -i -E "${LINE}s/([A-Za-z_]*bpf_spoof[A-Za-z_]*[[:space:]]*==[[:space:]]*1)\b/\\1 \&\& 0 \/* BPF_SPOOF_ALWAYS_FULL_PATCH *\//" "$f"

            echo "=== $f satır $LINE (patch sonrası) ==="
            sed -n "$((LINE>3?LINE-3:1)),$((LINE+3))p" "$f"

            if ! grep -q "BPF_SPOOF_ALWAYS_FULL_PATCH" "$f"; then
              echo "::error::$f satır $LINE'e patch eklenemedi (sed eşleşmedi)."
              exit 1
            fi
            PATCHED=1
          done

          if [ "$PATCHED" -eq 0 ]; then
            echo "::error::'bpf_spoof' + '== 1' kalıbı otomatik bulunamadı."
            echo "::error::Yukarıdaki 'bpf_spoof geçen tüm satırlar' çıktısını kopyala,"
            echo "::error::gerçek koda göre kesin patch'i yazacağız."
            exit 1
          fi

      - name: Run kernel's own build script
        working-directory: kernel
        run: |
          # do_build.sh kullanımı: ./do_build.sh <device> <options>
          # device: ginkgo | laurel_sprout | all
          # options: k=KernelSU, s=SukiSU, x=XXKSU, c=clean, f=force tüm varyantlar
          # Vanilla (rootsuz) + temiz build için sade "ginkgo" veriyoruz.
          #
          # NOT: ckbuild.sh içinde "l" (küçük L) argümanı Full-LTO'ya
          # geçiriyor (varsayılan zaten ThinLTO). Full-LTO teorik olarak
          # birkaç % daha iyi kod üretebilir ama bu 4 çekirdekli Snapdragon
          # 665 (Cortex-A73/A53) için build süresini çok uzatır ve gerçek
          # dünyada ölçülebilir/garanti bir kazanç değildir - bu yüzden
          # eklemedik. İstersen "ginkgo cl" ile deneyebilirsin.
          chmod +x do_build.sh
          ./do_build.sh ginkgo c 2>&1 | tee build.log

      - name: Check build output
        working-directory: kernel
        run: |
          echo "=== build/ dizini içeriği (ckbuild.sh muhtemelen buraya yazıyor) ==="
          find build -maxdepth 4 2>/dev/null
          echo "=== Tüm Image adaylarını ara ==="
          find . \( -name "Image*" -o -name "*.dtb" -o -name "*anykernel*.zip" \) \
            -not -path "./.git/*" 2>/dev/null | tee found_artifacts.txt
          if [ ! -s found_artifacts.txt ]; then
            echo "::error::Kernel Image üretilemedi, build.log'un son 200 satırı:"
            tail -n 200 build.log
            exit 1
          fi
          echo "Bulunan dosyalar:"
          cat found_artifacts.txt

      - name: Clone trinket-specific AnyKernel3 (fallback packaging)
        run: |
          git clone --depth=1 "https://github.com/${{ github.event.inputs.anykernel_repo }}.git" AnyKernel3 || true

      - name: Package flashable zip
        run: |
          cd kernel
          READY_ZIP=$(find . -iname "*anykernel*.zip" -o -iname "*ginkgo*.zip" 2>/dev/null | grep -v "^./AnyKernel3" | head -n1)
          if [ -n "$READY_ZIP" ]; then
            echo "Hazır zip bulundu: $READY_ZIP"
            cp "$READY_ZIP" "../ginkgo-floppy-kernel-$(date +%Y%m%d-%H%M).zip"
          else
            echo "Hazır zip yok, Image'i manuel AnyKernel3'e paketliyoruz."
            IMG=$(find . -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" 2>/dev/null | head -n1)
            echo "Kullanılan Image: $IMG"
            cp "$IMG" ../AnyKernel3/ 2>/dev/null || true

            if [ -f ../AnyKernel3/anykernel.sh ]; then
              if grep -q "^cmdline=" ../AnyKernel3/anykernel.sh; then
                sed -i 's|^cmdline=.*|cmdline="cgroup_disable=pressure androidboot.selinux=permissive uname_bpf_spoof=2"|' ../AnyKernel3/anykernel.sh
              fi
            fi

            cd ../AnyKernel3
            zip -r9 "../ginkgo-floppy-kernel-$(date +%Y%m%d-%H%M).zip" . -x ".git*"
          fi

      - name: Upload build log (her zaman)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log

      - name: Upload flashable kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ginkgo-floppy-kernel
          path: ginkgo-floppy-kernel-*.zip
