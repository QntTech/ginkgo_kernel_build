name: Build Ginkgo Debug Kernel (Floppy base, UART/OneUI bring-up)

# Elindeki çalışan kernel Floppy Kernel (flopster101), kaynağı:
#   https://github.com/FlopKernel-Series/flop_trinket-mi_kernel  (branch: floppy-unity)
# Bu repo kendi build script'ini içeriyor: do_build.sh
# Kendi make komutlarımızı tahmin etmek yerine BU script'i çalıştırıyoruz,
# çünkü doğru defconfig/toolchain/flag seçimini zaten biliyor.
#
# Amaç: aynı taban üzerine UART/earlycon debug config'lerini ekleyip
# derleyerek, kernel başladıktan sonra UART'ın neden sessiz kaldığını görmek.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel kaynak reposu"
        required: true
        default: "FlopKernel-Series/flop_trinket-mi_kernel"
      kernel_branch:
        description: "Branch"
        required: true
        default: "floppy-unity"
      anykernel_repo:
        description: "Trinket'e özel AnyKernel3 şablonu"
        required: true
        default: "FlopKernel-Series/AnyKernel3-trinket"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential python3 python3-pip \
            git curl zip unzip device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            lld llvm clang

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" \
            "https://github.com/${{ github.event.inputs.kernel_repo }}.git" kernel
          cd kernel && git log -1 --oneline
          echo "--- do_build.sh içeriği ---"
          cat do_build.sh || echo "do_build.sh bulunamadı, dosya listesi:"
          ls -la

      - name: Inspect build script and defconfig locations
        working-directory: kernel
        run: |
          echo "=== do_build.sh ==="
          cat do_build.sh 2>/dev/null || true
          echo "=== Olası defconfig dosyaları ==="
          find . -iname "*ginkgo*defconfig*" -o -iname "*trinket*defconfig*" 2>/dev/null
          find arch/arm64/configs -maxdepth 3 -type f 2>/dev/null | head -50

      # do_build.sh muhtemelen kendi toolchain'ini indiriyor (AOSP Clang).
      # Script'in kendi mantığını bozmamak için burada ayrıca toolchain
      # indirmiyoruz — script'in PATH'i ne yapıyorsa onu izliyoruz.
      - name: Apply UART/debug config fragment before build
        working-directory: kernel
        run: |
          # do_build.sh'in kullandığı gerçek defconfig dosyasını bul
          DEFCONFIG_PATH=$(find arch/arm64/configs -iname "*ginkgo*" -o -iname "*trinket*" 2>/dev/null | grep -v dts | head -n1)
          if [ -z "$DEFCONFIG_PATH" ]; then
            DEFCONFIG_PATH=$(find . -iname "vendor" -type d -path "*configs*" 2>/dev/null | head -n1)/ginkgo.config
          fi
          echo "Debug config eklenecek dosya: $DEFCONFIG_PATH"

          if [ -f "$DEFCONFIG_PATH" ]; then
            cat >> "$DEFCONFIG_PATH" << 'EOF'

          # ---- UART / early console debug (bring-up amaçlı, geçici) ----
          CONFIG_SERIAL_MSM_GENI=y
          CONFIG_SERIAL_MSM_GENI_CONSOLE=y
          CONFIG_SERIAL_EARLYCON=y
          CONFIG_SERIAL_CORE_CONSOLE=y
          CONFIG_MSM_GENI_EARLY_CONSOLE=y
          CONFIG_EARLY_PRINTK=y
          CONFIG_CONSOLE_LOGLEVEL_DEFAULT=15
          CONFIG_CONSOLE_LOGLEVEL_QUIET=15
          CONFIG_MESSAGE_LOGLEVEL_DEFAULT=7
          CONFIG_DEFAULT_MESSAGE_LOGLEVEL=7
          CONFIG_PRINTK_TIME=y
          CONFIG_PRINTK_PROCESS=y
          CONFIG_DYNAMIC_DEBUG=y
          CONFIG_LOG_BUF_SHIFT=21
          CONFIG_PSTORE=y
          CONFIG_PSTORE_CONSOLE=y
          CONFIG_PSTORE_RAM=y
          CONFIG_PSTORE_PMSG=y
          CONFIG_PANIC_TIMEOUT=0
          CONFIG_PANIC_ON_OOPS=n
          CONFIG_DEBUG_KERNEL=y
          CONFIG_MAGIC_SYSRQ=y
          CONFIG_BOOTPARAM_HARDLOCKUP_PANIC=n
          CONFIG_BOOTPARAM_SOFTLOCKUP_PANIC=n
          CONFIG_CMDLINE="console=ttyMSM0,115200n8 earlycon=qcom_geni,uart earlyprintk debug ignore_loglevel initcall_debug"
          CONFIG_CMDLINE_EXTEND=y
          EOF
            echo "Config eklendi."
          else
            echo "::warning::Defconfig otomatik bulunamadı, do_build.sh log'undaki gerçek yolu görüp manuel ekleyeceğiz."
          fi

      - name: Run kernel's own build script
        working-directory: kernel
        run: |
          chmod +x do_build.sh
          # do_build.sh interaktif bir menü/prompt bekliyorsa burada patlar;
          # log çıktısına göre ikinci deneme adımda flag/env ayarlarız.
          ./do_build.sh 2>&1 | tee build.log || true

      - name: Fallback manual build (if do_build.sh failed or needs args)
        working-directory: kernel
        if: always()
        run: |
          if [ ! -f build.log ] || ! grep -qi "Image" build.log; then
            echo "do_build.sh çıktısında Image bulunamadı, manuel build deneniyor."
            export ARCH=arm64
            export SUBARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            DEFCONFIG_NAME=$(find arch/arm64/configs -iname "*ginkgo*defconfig*" -o -iname "*trinket*defconfig*" | head -n1 | xargs -n1 basename 2>/dev/null)
            echo "Denenen defconfig: $DEFCONFIG_NAME"
            if [ -n "$DEFCONFIG_NAME" ]; then
              make O=out ARCH=arm64 "$DEFCONFIG_NAME"
              make -j$(nproc) O=out ARCH=arm64 \
                CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
                OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
                CROSS_COMPILE=$CROSS_COMPILE \
                CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
                2>&1 | tee -a build.log
            fi
          fi

      - name: Check build output
        working-directory: kernel
        run: |
          find . -name "Image*" -newer do_build.sh 2>/dev/null | tee found_artifacts.txt
          find out -name "Image*" 2>/dev/null | tee -a found_artifacts.txt
          if [ ! -s found_artifacts.txt ]; then
            echo "::error::Kernel Image üretilemedi, build.log'un son 200 satırı:"
            tail -n 200 build.log
            exit 1
          fi
          echo "Bulunan Image dosyaları:"
          cat found_artifacts.txt

      - name: Clone trinket-specific AnyKernel3
        run: |
          git clone --depth=1 "https://github.com/${{ github.event.inputs.anykernel_repo }}.git" AnyKernel3

      - name: Package flashable zip
        run: |
          IMG=$(find kernel -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" 2>/dev/null | grep -v uploads | head -n1)
          echo "Kullanılan Image: $IMG"
          cp "$IMG" AnyKernel3/ 2>/dev/null || true

          # cmdline'ı AnyKernel3 seviyesinde de garantiye al
          if [ -f AnyKernel3/anykernel.sh ]; then
            if grep -q "^cmdline=" AnyKernel3/anykernel.sh; then
              sed -i 's|^cmdline=.*|cmdline="console=ttyMSM0,115200n8 earlycon=qcom_geni,uart earlyprintk debug ignore_loglevel initcall_debug"|' AnyKernel3/anykernel.sh
            fi
          fi

          cd AnyKernel3
          zip -r9 ../ginkgo-floppy-debug-kernel-$(date +%Y%m%d-%H%M).zip . -x ".git*"

      - name: Upload build log (her zaman)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log

      - name: Upload flashable kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ginkgo-floppy-debug-kernel
          path: ginkgo-floppy-debug-kernel-*.zip
