name: Build Ginkgo Debug Kernel (Floppy base, UART/OneUI bring-up)

# Elindeki çalışan kernel Floppy Kernel (flopster101), kaynağı:
#   https://github.com/FlopKernel-Series/flop_trinket-mi_kernel  (branch: floppy-unity)
# Bu repo kendi build script'ini içeriyor: do_build.sh
# Kendi make komutlarımızı tahmin etmek yerine BU script'i çalıştırıyoruz,
# çünkü doğru defconfig/toolchain/flag seçimini zaten biliyor.
#
# Amaç: aynı taban üzerine UART/earlycon debug config'lerini ekleyip
# derleyerek, kernel başladıktan sonra UART'ın neden sessiz kaldığını görmek.
#
# v2: CONFIG_SECURITY_SELINUX_BOOTPARAM tek başına yetersiz çıktı - init
# kendi setenforce(1) çağrısını yapıp enforcing'e zorluyordu (OneUI/A35
# prebuilt init, ALLOW_PERMISSIVE_SELINUX olmadan derlenmiş). Bunu
# security/selinux/selinuxfs.c içindeki sel_write_enforce() fonksiyonunu
# kaynak seviyesinde patch'leyerek çözdük: userspace ne yazarsa yazsın,
# kernel gerçekte hep permissive kalıyor.
#
# v3: netbpfload/bpfloader/netd zinciri boot'u engelliyordu.
# Kernel deposunu inceleyince (kernel/sys.c + init/main.c) şunu bulduk:
# bu kernel ZATEN "uname_bpf_spoof" adında, Android'in BPF kernel-sürüm
# kontrolünü atlatmak için tasarlanmış hazır bir mekanizma taşıyor.
# İki ayrı ayar var:
#   1) Kconfig seçimi (CONFIG_FAKE_UNAME_*): şu an defconfig'de 5.4
#      seçili (trinket-perf_defconfig satır 64), ama Android 16 "25Q4"
#      netbpfload build'i en az kernel 5.10 istiyor
#      ("NetBpfLoad: Android 25Q4 requires kernel 5.10." - UART log'unda
#      görüldü). Bu yüzden 5.4 yerine 5.10'u seçiyoruz (FAKE_UNAME_5_10
#      -> sahte sürüm "5.10.239" bildirir, gerçek kernel değişmiyor).
#   2) cmdline'daki "uname_bpf_spoof=" değeri: bootloader şu an "1"
#      geçiyor, bu SADECE netbpfload process'i için spoof yapıyor
#      (kernel/sys.c: bpf_spoof==1 -> partial mode). UART log'unda netd
#      de hemen çöküyordu - kernel kaynağında "full mode" (1 dışındaki
#      herhangi bir değer) netd ve uprobestats'ı da spoof kapsamına alıyor.
#
# v4 (bu revizyon): v3'teki cmdline fix'i (uname_bpf_spoof=2) test edildi
# ve İŞE YARAMADI - netd hâlâ "V+ platform with kernel version < 4.19.0
# is unsupported" diyerek abort ediyordu (bkz. logcat: NetdUpdatable).
# Sebep bulundu: CONFIG_CMDLINE_EXTEND=y ile kernel'in KENDİ CONFIG_CMDLINE'ı
# ÖNCE, bootloader'ın (LK/ABL - bu build'in dışında, ayrı partition) kendi
# varsayılan cmdline'ı SONRA ekleniyor. O varsayılan cmdline'da
# "uname_bpf_spoof=1" zaten sabit geçiyor. Aynı parametre iki kez geçince
# kernel'in parametre parser'ı SONUNCUSUNU kullanıyor - yani bizim "=2"
# değerimiz her seferinde bootloader'ın "=1"i tarafından eziliyor.
# Cmdline üzerinden çözülemeyecek bir sorun; bootloader'a dokunmadan
# (DTB/LK tarafını değiştirmeden) çözmek için "bpf_spoof == 1" (partial
# mode) karşılaştırmasını kaynak seviyesinde HİÇBİR ZAMAN doğru olamayacak
# şekilde nötrlüyoruz - cmdline ne derse desin kod hep "full mode"a düşer.
# Yöntem, sel_write_enforce patch'iyle aynı: userspace/bootloader'ın isteği
# görmezden gelinir, kernel kendi kararını dayatır.
#
# Not: com.android.tethering.apex'i sistem build'inden çıkarmıştık
# (bpfloader'ın reboot_on_failure'ını atlatmak için) - bu netd'yi BPF
# programsız bıraktığı için netd crashloop'una ve Samsung bootchecker'ın
# zorla reboot atmasına yol açtı. APEX geri eklendi (netbpfload artık
# gerçekten çalışıp BPF programlarını yüklüyor); netd'nin şimdiki çöküşü
# BPF eksikliğinden değil, bu yml'nin çözmeye çalıştığı kernel-sürüm
# spoof sorunundan kaynaklanıyor.
#
# Mevcut UART/earlycon/pstore/log debug ayarlarına ve SELinux patch
# adımına dokunulmadı.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel kaynak reposu"
        required: true
        default: "FlopKernel-Series/flop_trinket-mi_kernel"
      kernel_branch:
        description: "Branch"
        required: true
        default: "floppy-unity"
      anykernel_repo:
        description: "Trinket'e özel AnyKernel3 şablonu"
        required: true
        default: "FlopKernel-Series/AnyKernel3-trinket"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential python3 python3-pip \
            git curl zip unzip device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            lld llvm clang

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" \
            "https://github.com/${{ github.event.inputs.kernel_repo }}.git" kernel
          cd kernel && git log -1 --oneline
          echo "--- do_build.sh içeriği ---"
          cat do_build.sh || echo "do_build.sh bulunamadı, dosya listesi:"
          ls -la

      # do_build.sh muhtemelen kendi toolchain'ini indiriyor (AOSP Clang).
      # Script'in kendi mantığını bozmamak için burada ayrıca toolchain
      # indirmiyoruz — script'in PATH'i ne yapıyorsa onu izliyoruz.
      - name: Apply UART/debug config fragment before build
        working-directory: kernel
        run: |
          # Doğrulandı: gerçek defconfig fragmanı arch/arm64/configs/vendor/ginkgo.config
          # (ckbuild.sh: DEFAULT_DEFCONFIG=vendor/trinket-perf_defconfig,
          #  GINKGO_FRAGMENT=vendor/ginkgo.config üstüne merge ediliyor)
          DEFCONFIG_PATH="arch/arm64/configs/vendor/ginkgo.config"
          echo "Debug config eklenecek dosya: $DEFCONFIG_PATH"

          cat >> "$DEFCONFIG_PATH" << 'EOF'

          # ---- UART / early console debug (bring-up amaçlı, geçici) ----
          CONFIG_SERIAL_MSM_GENI=y
          CONFIG_SERIAL_MSM_GENI_CONSOLE=y
          CONFIG_SERIAL_EARLYCON=y
          CONFIG_SERIAL_CORE_CONSOLE=y
          CONFIG_MSM_GENI_EARLY_CONSOLE=y
          CONFIG_EARLY_PRINTK=y
          CONFIG_CONSOLE_LOGLEVEL_DEFAULT=15
          CONFIG_CONSOLE_LOGLEVEL_QUIET=15
          CONFIG_MESSAGE_LOGLEVEL_DEFAULT=7
          CONFIG_DEFAULT_MESSAGE_LOGLEVEL=7
          CONFIG_PRINTK_TIME=y
          CONFIG_PRINTK_PROCESS=y
          CONFIG_DYNAMIC_DEBUG=y
          CONFIG_LOG_BUF_SHIFT=21
          CONFIG_PSTORE=y
          CONFIG_PSTORE_CONSOLE=y
          CONFIG_PSTORE_RAM=y
          CONFIG_PSTORE_PMSG=y
          CONFIG_PANIC_TIMEOUT=0
          CONFIG_PANIC_ON_OOPS=n
          CONFIG_DEBUG_KERNEL=y
          CONFIG_MAGIC_SYSRQ=y
          CONFIG_BOOTPARAM_HARDLOCKUP_PANIC=n
          CONFIG_BOOTPARAM_SOFTLOCKUP_PANIC=n

          # ---- SELinux: varsayılan başlangıç durumu (yetersiz tek başına,
          #      asıl zorlama aşağıdaki kaynak patch'inde - bkz. bir sonraki step) ----
          CONFIG_SECURITY_SELINUX_BOOTPARAM=y
          CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0
          CONFIG_SECURITY_SELINUX_DEVELOP=y

          # ---- v3: netbpfload/netd BPF kernel-sürüm kontrolünü geçmek ----
          # Base defconfig'de FAKE_UNAME_5_4 seçili, Android 16 "25Q4"
          # netbpfload build'i >=5.10 istiyor - 5.10'a yükseltiyoruz.
          # CONFIG_FAKE_UNAME_5_4 is not set
          CONFIG_FAKE_UNAME_5_10=y

          # NOT (v4): "uname_bpf_spoof=2" burada hâlâ duruyor ama tek
          # başına ETKİSİZ - CONFIG_CMDLINE_EXTEND=y ile bootloader'ın
          # kendi "uname_bpf_spoof=1"i bu değerin ÜZERİNE yazıyor (sonuncu
          # değer kazanıyor). Asıl fix aşağıdaki yeni source-patch adımında.
          # Zararı yok, kaldırmaya gerek de yok.
          CONFIG_CMDLINE="console=ttyMSM0,115200n8 earlycon=qcom_geni,uart earlyprintk debug ignore_loglevel initcall_debug androidboot.selinux=permissive uname_bpf_spoof=2"
          CONFIG_CMDLINE_EXTEND=y
          EOF
          echo "Config eklendi, son 35 satır:"
          tail -35 "$DEFCONFIG_PATH"

      # ASIL FİX BURADA: init'in setenforce(1) çağrısını kernel seviyesinde
      # etkisiz hale getiriyoruz. sel_write_enforce() /sys/fs/selinux/enforce
      # yazma işleyicisidir; userspace'ten gelen değeri okuduktan hemen sonra
      # 0'a sabitliyoruz, böylece init "enforcing'e geçtim" sanır ama
      # selinux_enforcing hep 0 kalır. AVC denied'lar loglanmaya devam eder
      # (audit_log çağrısı dokunulmadan kalıyor), sadece artık gerçek bir
      # engelleme/EACCES üretmiyorlar.
      - name: Patch sel_write_enforce() to ignore userspace enforcing requests
        working-directory: kernel
        run: |
          set -eu
          SELINUXFS="security/selinux/selinuxfs.c"
          if [ ! -f "$SELINUXFS" ]; then
            echo "::error::$SELINUXFS bulunamadı, kernel ağacı beklenenden farklı yapıda olabilir."
            find . -name "selinuxfs.c" -not -path "./.git/*"
            exit 1
          fi

          if grep -q "FORCE PERMISSIVE PATCH" "$SELINUXFS"; then
            echo "Zaten patch'lenmiş, tekrar patch'lemiyorum."
            exit 0
          fi

          echo "=== sel_write_enforce - patch öncesi (satır numaralı) ==="
          grep -n "sel_write_enforce" "$SELINUXFS"
          FUNC_START=$(grep -n "^static ssize_t sel_write_enforce" "$SELINUXFS" | head -1 | cut -d: -f1)
          if [ -z "$FUNC_START" ]; then
            echo "::error::sel_write_enforce fonksiyon başlangıcı bulunamadı, dosya yapısı beklenenden farklı."
            grep -n "write_enforce\|sscanf" "$SELINUXFS" || true
            exit 1
          fi
          echo "Fonksiyon $FUNC_START. satırda başlıyor, sonraki 40 satır:"
          sed -n "${FUNC_START},$((FUNC_START+40))p" "$SELINUXFS"

          # Fonksiyon gövdesi içinde (başlangıçtan sonraki ~40 satırda) sscanf
          # çağrısının bulunduğu satırı ara - bu satır userspace'ten gelen
          # new_value'yu okur. Tam metin eşleşmesi yerine satır numarası +
          # basit substring araması kullanıyoruz, whitespace/quoting'e karşı
          # kırılgan olmasın diye (önceki python heredoc denemesi girinti
          # yüzünden sessizce başarısız olmuştu).
          SSCANF_LINE=$(awk -v start="$FUNC_START" -v end="$((FUNC_START+60))" \
            'NR>=start && NR<=end && /sscanf/ {print NR; exit}' "$SELINUXFS")
          if [ -z "$SSCANF_LINE" ]; then
            echo "::error::sscanf satırı sel_write_enforce içinde bulunamadı."
            exit 1
          fi
          echo "sscanf çağrısı $SSCANF_LINE. satırda bulundu:"
          sed -n "${SSCANF_LINE}p" "$SELINUXFS"

          # sscanf'ten sonraki ilk ";" ile biten satırı (genelde "goto out;")
          # bul, patch'i onun HEMEN ALTINA ekle - böylece hem tek satırlık
          # "if (sscanf(...) != 1) goto out;" hem de iki satıra bölünmüş
          # hali için çalışır.
          INSERT_AFTER=$(awk -v s="$SSCANF_LINE" -v end="$((SSCANF_LINE+3))" \
            'NR>=s && NR<=end && /;/ {print NR; exit}' "$SELINUXFS")
          if [ -z "$INSERT_AFTER" ]; then
            echo "::error::sscanf sonrası satır bulunamadı."
            exit 1
          fi
          echo "Patch, ${INSERT_AFTER}. satırdan sonra eklenecek:"
          sed -n "${INSERT_AFTER}p" "$SELINUXFS"

          # sed 'r <dosya>' ile ekleme: metni önce düz bir dosyaya yazıp
          # (heredoc'un YAML'dan miras aldığı baştaki boşluklar C için
          # zararsız - Python'daki gibi girintiye duyarlı değil), sonra
          # sed'e sadece dosya adını veriyoruz. Hiçbir escape/quoting riski
          # yok - önceki "a\" denemesinde yaşanan sorunun kökü buydu.
          # Not: heredoc kasıtlı olarak kullanılmıyor - YAML blok metninin
          # girinti kuralı ile bash heredoc'un "bitiş etiketi flush-left
          # olmalı" kuralı çelişiyor (biri boşluk ister, diğeri boşluksuz).
          # printf ile gerçek \n karakteri üretmek, girintiden tamamen
          # bağımsız ve tek satırlık - hiçbir çelişki yok.
          printf '\n    /* FORCE PERMISSIVE PATCH: ignore whatever userspace (init) requests,\n     * always keep the kernel in permissive mode. AVC denials are still\n     * logged below via audit_log(), they just never become blocking. */\n    new_value = 0;\n' > /tmp/selinux_patch_snippet.txt
          sed -i "${INSERT_AFTER}r /tmp/selinux_patch_snippet.txt" "$SELINUXFS"

          if ! grep -q "FORCE PERMISSIVE PATCH" "$SELINUXFS"; then
            echo "::error::Patch eklendi ama marker dosyada bulunamadı, sed başarısız olmuş olabilir."
            exit 1
          fi

          echo "=== sel_write_enforce - patch sonrası (satır numaralı) ==="
          sed -n "${FUNC_START},$((FUNC_START+45))p" "$SELINUXFS"

          echo "=== Doğrulama: new_value = 0; satırı gerçekten sscanf'ten SONRA mı? ==="
          NEWVAL_LINE=$(grep -n "new_value = 0;" "$SELINUXFS" | head -1 | cut -d: -f1)
          if [ -z "$NEWVAL_LINE" ] || [ "$NEWVAL_LINE" -le "$SSCANF_LINE" ]; then
            echo "::error::new_value = 0; satırı sscanf'ten önce ya da hiç yok - patch mantığı bozuk."
            exit 1
          fi
          echo "OK: new_value = 0; satır $NEWVAL_LINE, sscanf satır $SSCANF_LINE'den sonra - sıralama doğru."

      # v4 - ASIL FİX BURADA: cmdline'dan "uname_bpf_spoof=2" göndermek işe
      # yaramıyor çünkü CONFIG_CMDLINE_EXTEND=y modunda bootloader'ın kendi
      # "uname_bpf_spoof=1"i bizimkinin ÜZERİNE yazıyor (sonuncu kazanıyor).
      # Bootloader/DTB tarafına dokunmadan çözmek için "partial mode"u
      # tetikleyen "bpf_spoof == 1" karşılaştırmasını kaynakta öyle bir
      # patch'liyoruz ki ASLA doğru olamasın (& 0 eklenerek) - bootloader
      # ne cmdline değeri gönderirse göndersin, kod hep "full mode"a düşer
      # (netd ve uprobestats de spoof kapsamına girer).
      #
      # Önce iki dosyada da ("kernel/sys.c" ve "init/main.c" - v3'te bu
      # ikisinde bulunmuştu) "bpf_spoof" geçen HER satırı basıyoruz ki
      # otomatik patch beklenenden farklı bir kalıp bulursa (ör. "!= 2"
      # ya da bitmask kontrolü gibi) bunu Actions log'unda görüp bana
      # yapıştırabilesin - körlemesine yanlış bir patch atıp build'i
      # sessizce bozmuyoruz, sel_write_enforce patch'indeki gibi net bir
      # hata ile duruyoruz.
      - name: Force uname_bpf_spoof full-mode regardless of cmdline value
        working-directory: kernel
        run: |
          set -eu
          echo "=== 'bpf_spoof' geçen tüm satırlar (kernel/sys.c + init/main.c) ==="
          grep -n "bpf_spoof" kernel/sys.c 2>/dev/null || echo "(kernel/sys.c içinde yok)"
          grep -n "bpf_spoof" init/main.c 2>/dev/null || echo "(init/main.c içinde yok)"

          PATCHED=0
          for f in kernel/sys.c init/main.c; do
            [ -f "$f" ] || continue

            if grep -q "BPF_SPOOF_ALWAYS_FULL_PATCH" "$f"; then
              echo "$f zaten patch'lenmiş, atlıyorum."
              PATCHED=1
              continue
            fi

            # Değişken adı ne olursa olsun ("uname_bpf_spoof", "bpf_spoof" vs.)
            # "bpf_spoof" içeren ve "== 1" ile karşılaştırma yapan satırı ara.
            LINE=$(grep -n "bpf_spoof" "$f" | grep -E '==[[:space:]]*1\b' | head -1 | cut -d: -f1)
            if [ -z "$LINE" ]; then
              continue
            fi

            echo "=== $f satır $LINE (patch öncesi) ==="
            sed -n "$((LINE>3?LINE-3:1)),$((LINE+3))p" "$f"

            # "bpf_spoof<opsiyonel_ek> == 1"  ->  aynı ifade + " && 0" ekleyip
            # karşılaştırmayı hiçbir zaman doğru olamayacak hale getiriyoruz.
            sed -i -E "${LINE}s/([A-Za-z_]*bpf_spoof[A-Za-z_]*[[:space:]]*==[[:space:]]*1)\b/\\1 \&\& 0 \/* BPF_SPOOF_ALWAYS_FULL_PATCH *\//" "$f"

            echo "=== $f satır $LINE (patch sonrası) ==="
            sed -n "$((LINE>3?LINE-3:1)),$((LINE+3))p" "$f"

            if ! grep -q "BPF_SPOOF_ALWAYS_FULL_PATCH" "$f"; then
              echo "::error::$f satır $LINE'e patch eklenemedi (sed eşleşmedi)."
              exit 1
            fi
            PATCHED=1
          done

          if [ "$PATCHED" -eq 0 ]; then
            echo "::error::'bpf_spoof' + '== 1' kalıbı otomatik bulunamadı."
            echo "::error::Yukarıdaki 'bpf_spoof geçen tüm satırlar' çıktısını kopyala,"
            echo "::error::gerçek koda göre kesin patch'i yazacağız."
            exit 1
          fi

      - name: Run kernel's own build script
        working-directory: kernel
        run: |
          # do_build.sh kullanımı: ./do_build.sh <device> <options>
          # device: ginkgo | laurel_sprout | all
          # options: k=KernelSU, s=SukiSU, x=XXKSU, c=clean, f=force tüm varyantlar
          # Vanilla (rootsuz) + temiz build için sade "ginkgo" veriyoruz.
          chmod +x do_build.sh
          ./do_build.sh ginkgo c 2>&1 | tee build.log

      - name: Check build output
        working-directory: kernel
        run: |
          echo "=== build/ dizini içeriği (ckbuild.sh muhtemelen buraya yazıyor) ==="
          find build -maxdepth 4 2>/dev/null
          echo "=== Tüm Image adaylarını ara ==="
          find . \( -name "Image*" -o -name "*.dtb" -o -name "*anykernel*.zip" \) \
            -not -path "./.git/*" 2>/dev/null | tee found_artifacts.txt
          if [ ! -s found_artifacts.txt ]; then
            echo "::error::Kernel Image üretilemedi, build.log'un son 200 satırı:"
            tail -n 200 build.log
            exit 1
          fi
          echo "Bulunan dosyalar:"
          cat found_artifacts.txt

      - name: Clone trinket-specific AnyKernel3 (fallback packaging)
        run: |
          # Eğer ckbuild.sh zaten kendi flashable zip'ini ürettiyse bu adım
          # sadece yedek; asıl zip found_artifacts.txt'te *anykernel*.zip
          # olarak görünüyorsa onu kullanacağız.
          git clone --depth=1 "https://github.com/${{ github.event.inputs.anykernel_repo }}.git" AnyKernel3 || true

      - name: Package flashable zip
        run: |
          cd kernel
          # 1) ckbuild.sh zaten bir flashable zip ürettiyse onu direkt kullan
          READY_ZIP=$(find . -iname "*anykernel*.zip" -o -iname "*ginkgo*.zip" 2>/dev/null | grep -v "^./AnyKernel3" | head -n1)
          if [ -n "$READY_ZIP" ]; then
            echo "Hazır zip bulundu: $READY_ZIP"
            cp "$READY_ZIP" "../ginkgo-floppy-debug-kernel-$(date +%Y%m%d-%H%M).zip"
          else
            echo "Hazır zip yok, Image'i manuel AnyKernel3'e paketliyoruz."
            IMG=$(find . -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" 2>/dev/null | head -n1)
            echo "Kullanılan Image: $IMG"
            cp "$IMG" ../AnyKernel3/ 2>/dev/null || true

            if [ -f ../AnyKernel3/anykernel.sh ]; then
              if grep -q "^cmdline=" ../AnyKernel3/anykernel.sh; then
                sed -i 's|^cmdline=.*|cmdline="console=ttyMSM0,115200n8 earlycon=qcom_geni,uart earlyprintk debug ignore_loglevel initcall_debug androidboot.selinux=permissive uname_bpf_spoof=2"|' ../AnyKernel3/anykernel.sh
              fi
            fi

            cd ../AnyKernel3
            zip -r9 "../ginkgo-floppy-debug-kernel-$(date +%Y%m%d-%H%M).zip" . -x ".git*"
          fi

      - name: Upload build log (her zaman)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log

      - name: Upload flashable kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ginkgo-floppy-debug-kernel
          path: ginkgo-floppy-debug-kernel-*.zip
