name: Build Ginkgo Debug Kernel (Floppy base, UART/OneUI bring-up)

# Elindeki çalışan kernel Floppy Kernel (flopster101), kaynağı:
#   https://github.com/FlopKernel-Series/flop_trinket-mi_kernel  (branch: floppy-unity)
# Bu repo kendi build script'ini içeriyor: do_build.sh
# Kendi make komutlarımızı tahmin etmek yerine BU script'i çalıştırıyoruz,
# çünkü doğru defconfig/toolchain/flag seçimini zaten biliyor.
#
# Amaç: aynı taban üzerine UART/earlycon debug config'lerini ekleyip
# derleyerek, kernel başladıktan sonra UART'ın neden sessiz kaldığını görmek.
#
# EK (bu revizyon - v2): önceki revizyonda eklenen
# CONFIG_SECURITY_SELINUX_BOOTPARAM=y / VALUE=0 YETERSİZ ÇIKTI.
# UART log'u gösterdi ki: kernel gerçekten permissive (old_enforcing=0)
# başlıyor, AMA init policy'yi yükledikten hemen sonra kendi
# security_setenforce(1) çağrısını yapıp enforcing'e zorluyor
# (log: "enforcing=1 old_enforcing=0" + "Init cannot set 'ro.boot.selinux'
# to 'permissive': Read-only property was already set"). Bu, init
# binary'sinin ALLOW_PERMISSIVE_SELINUX olmadan derlenmiş olmasından
# kaynaklanıyor (OneUI/A35 prebuilt init, production/Knox sertleştirmesi)
# - yani init kernel cmdline'daki androidboot.selinux=permissive'i
# görmezden gelip her zaman enforcing'e geçmeye çalışıyor.
#
# Config bayrağı sadece "varsayılan başlangıç değerini" belirliyor,
# userspace'in SONRADAN /sys/fs/selinux/enforce'a yazıp değiştirmesini
# ENGELLEMİYOR. O yüzden artık security/selinux/selinuxfs.c içindeki
# sel_write_enforce() fonksiyonunu KAYNAK SEVİYESİNDE patch'liyoruz:
# userspace ne yazarsa yazsın (init'in setenforce(1) çağrısı dahil),
# kernel bunu her zaman "0" (permissive) olarak işliyor. init "enforcing'e
# geçtim" sanıyor ama kernel gerçekte hiç geçmiyor, AVC denied'lar hâlâ
# loglanıyor (dmesg/audit'te görünmeye devam eder) ama artık hiçbiri
# EACCES/abort() üretmiyor. Bu, netd'nin A35'ten kalma
# "dumplog_data_file" (Samsung/OneUI-özel sepolicy etiketi, ginkgo'da
# karşılığı yok) dizinine erişirken aldığı AVC denied yüzünden abort()
# ile çöküp bootchecker'ın onu (ve zygote'u) sürekli restart ettiği
# kısır döngüyü kırmak için.
#
# Mevcut UART/earlycon/pstore/log debug ayarlarına dokunulmadı, önceki
# config bloğu da (zararı olmadığı, ayrıca varsayılan durumu doğru
# ayarladığı için) bırakıldı - asıl işi şimdi kaynak patch'i yapıyor.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel kaynak reposu"
        required: true
        default: "FlopKernel-Series/flop_trinket-mi_kernel"
      kernel_branch:
        description: "Branch"
        required: true
        default: "floppy-unity"
      anykernel_repo:
        description: "Trinket'e özel AnyKernel3 şablonu"
        required: true
        default: "FlopKernel-Series/AnyKernel3-trinket"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential python3 python3-pip \
            git curl zip unzip device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            lld llvm clang

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" \
            "https://github.com/${{ github.event.inputs.kernel_repo }}.git" kernel
          cd kernel && git log -1 --oneline
          echo "--- do_build.sh içeriği ---"
          cat do_build.sh || echo "do_build.sh bulunamadı, dosya listesi:"
          ls -la

      # do_build.sh muhtemelen kendi toolchain'ini indiriyor (AOSP Clang).
      # Script'in kendi mantığını bozmamak için burada ayrıca toolchain
      # indirmiyoruz — script'in PATH'i ne yapıyorsa onu izliyoruz.
      - name: Apply UART/debug config fragment before build
        working-directory: kernel
        run: |
          # Doğrulandı: gerçek defconfig fragmanı arch/arm64/configs/vendor/ginkgo.config
          DEFCONFIG_PATH="arch/arm64/configs/vendor/ginkgo.config"
          echo "Debug config eklenecek dosya: $DEFCONFIG_PATH"

          cat >> "$DEFCONFIG_PATH" << 'EOF'

          # ---- UART / early console debug (bring-up amaçlı, geçici) ----
          CONFIG_SERIAL_MSM_GENI=y
          CONFIG_SERIAL_MSM_GENI_CONSOLE=y
          CONFIG_SERIAL_EARLYCON=y
          CONFIG_SERIAL_CORE_CONSOLE=y
          CONFIG_MSM_GENI_EARLY_CONSOLE=y
          CONFIG_EARLY_PRINTK=y
          CONFIG_CONSOLE_LOGLEVEL_DEFAULT=15
          CONFIG_CONSOLE_LOGLEVEL_QUIET=15
          CONFIG_MESSAGE_LOGLEVEL_DEFAULT=7
          CONFIG_DEFAULT_MESSAGE_LOGLEVEL=7
          CONFIG_PRINTK_TIME=y
          CONFIG_PRINTK_PROCESS=y
          CONFIG_DYNAMIC_DEBUG=y
          CONFIG_LOG_BUF_SHIFT=21
          CONFIG_PSTORE=y
          CONFIG_PSTORE_CONSOLE=y
          CONFIG_PSTORE_RAM=y
          CONFIG_PSTORE_PMSG=y
          CONFIG_PANIC_TIMEOUT=0
          CONFIG_PANIC_ON_OOPS=n
          CONFIG_DEBUG_KERNEL=y
          CONFIG_MAGIC_SYSRQ=y
          CONFIG_BOOTPARAM_HARDLOCKUP_PANIC=n
          CONFIG_BOOTPARAM_SOFTLOCKUP_PANIC=n

          # ---- SELinux: varsayılan başlangıç durumu (yetersiz tek başına,
          #      asıl zorlama aşağıdaki kaynak patch'inde - bkz. bir sonraki step) ----
          CONFIG_SECURITY_SELINUX_BOOTPARAM=y
          CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0
          CONFIG_SECURITY_SELINUX_DEVELOP=y

          CONFIG_CMDLINE="console=ttyMSM0,115200n8 earlycon=qcom_geni,uart earlyprintk debug ignore_loglevel initcall_debug androidboot.selinux=permissive"
          CONFIG_CMDLINE_EXTEND=y
          EOF
          echo "Config eklendi, son 30 satır:"
          tail -30 "$DEFCONFIG_PATH"

      # ASIL FİX BURADA: init'in setenforce(1) çağrısını kernel seviyesinde
      # etkisiz hale getiriyoruz. sel_write_enforce() /sys/fs/selinux/enforce
      # yazma işleyicisidir; userspace'ten gelen değeri okuduktan hemen sonra
      # 0'a sabitliyoruz, böylece init "enforcing'e geçtim" sanır ama
      # selinux_enforcing hep 0 kalır. AVC denied'lar loglanmaya devam eder
      # (audit_log çağrısı dokunulmadan kalıyor), sadece artık gerçek bir
      # engelleme/EACCES üretmiyorlar.
      - name: Patch sel_write_enforce() to ignore userspace enforcing requests
        working-directory: kernel
        run: |
          SELINUXFS="security/selinux/selinuxfs.c"
          if [ ! -f "$SELINUXFS" ]; then
            echo "::error::$SELINUXFS bulunamadı, kernel ağacı beklenenden farklı yapıda olabilir."
            find . -name "selinuxfs.c" -not -path "./.git/*"
            exit 1
          fi

          echo "=== Patch öncesi sel_write_enforce (ilgili kısım) ==="
          grep -n "sel_write_enforce" -A 25 "$SELINUXFS" | head -40

          # sscanf ile new_value okunduktan hemen sonra 0'a sabitliyoruz.
          # Farklı kernel sürümlerinde tam biçim değişebildiği için birkaç
          # olası kalıbı sırayla deniyoruz, ilk eşleşen uygulanır.
          PATCHED=0

          if ! grep -q "FORCE PERMISSIVE PATCH" "$SELINUXFS"; then
            if grep -q 'if (sscanf(page, "%d", &new_value) != 1)' "$SELINUXFS"; then
              python3 - "$SELINUXFS" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path, "r") as f:
              content = f.read()

          marker = 'if (sscanf(page, "%d", &new_value) != 1)\n\t\tgoto out;'
          if marker in content:
              replacement = marker + '\n\n\t/* FORCE PERMISSIVE PATCH: ignore whatever userspace (init) requests,\n\t * always keep the kernel in permissive mode. AVC denials are still\n\t * logged below via audit_log(), they just never become blocking. */\n\tnew_value = 0;'
              content = content.replace(marker, replacement, 1)
              with open(path, "w") as f:
                  f.write(content)
              print("PATCH_OK")
          else:
              print("PATCH_MARKER_NOT_FOUND")
          PYEOF
              if grep -q "FORCE PERMISSIVE PATCH" "$SELINUXFS"; then
                PATCHED=1
              fi
            fi
          fi

          if [ "$PATCHED" -eq 0 ]; then
            echo "::error::Otomatik patch uygulanamadı - sel_write_enforce fonksiyonunun tam hali beklenenden farklı."
            echo "İlgili fonksiyonun tam içeriği (elle bakıp adapte etmek için):"
            grep -n "sel_write_enforce" -A 40 "$SELINUXFS"
            exit 1
          fi

          echo "=== Patch sonrası sel_write_enforce (ilgili kısım) ==="
          grep -n "sel_write_enforce" -A 30 "$SELINUXFS" | head -45

      - name: Run kernel's own build script
        working-directory: kernel
        run: |
          # do_build.sh kullanımı: ./do_build.sh <device> <options>
          # device: ginkgo | laurel_sprout | all
          # options: k=KernelSU, s=SukiSU, x=XXKSU, c=clean, f=force tüm varyantlar
          # Vanilla (rootsuz) + temiz build için sade "ginkgo" veriyoruz.
          chmod +x do_build.sh
          ./do_build.sh ginkgo c 2>&1 | tee build.log

      - name: Check build output
        working-directory: kernel
        run: |
          echo "=== build/ dizini içeriği (ckbuild.sh muhtemelen buraya yazıyor) ==="
          find build -maxdepth 4 2>/dev/null
          echo "=== Tüm Image adaylarını ara ==="
          find . \( -name "Image*" -o -name "*.dtb" -o -name "*anykernel*.zip" \) \
            -not -path "./.git/*" 2>/dev/null | tee found_artifacts.txt
          if [ ! -s found_artifacts.txt ]; then
            echo "::error::Kernel Image üretilemedi, build.log'un son 200 satırı:"
            tail -n 200 build.log
            exit 1
          fi
          echo "Bulunan dosyalar:"
          cat found_artifacts.txt

      - name: Clone trinket-specific AnyKernel3 (fallback packaging)
        run: |
          # Eğer ckbuild.sh zaten kendi flashable zip'ini ürettiyse bu adım
          # sadece yedek; asıl zip found_artifacts.txt'te *anykernel*.zip
          # olarak görünüyorsa onu kullanacağız.
          git clone --depth=1 "https://github.com/${{ github.event.inputs.anykernel_repo }}.git" AnyKernel3 || true

      - name: Package flashable zip
        run: |
          cd kernel
          # 1) ckbuild.sh zaten bir flashable zip ürettiyse onu direkt kullan
          READY_ZIP=$(find . -iname "*anykernel*.zip" -o -iname "*ginkgo*.zip" 2>/dev/null | grep -v "^./AnyKernel3" | head -n1)
          if [ -n "$READY_ZIP" ]; then
            echo "Hazır zip bulundu: $READY_ZIP"
            cp "$READY_ZIP" "../ginkgo-floppy-debug-kernel-$(date +%Y%m%d-%H%M).zip"
          else
            echo "Hazır zip yok, Image'i manuel AnyKernel3'e paketliyoruz."
            IMG=$(find . -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" 2>/dev/null | head -n1)
            echo "Kullanılan Image: $IMG"
            cp "$IMG" ../AnyKernel3/ 2>/dev/null || true

            if [ -f ../AnyKernel3/anykernel.sh ]; then
              if grep -q "^cmdline=" ../AnyKernel3/anykernel.sh; then
                sed -i 's|^cmdline=.*|cmdline="console=ttyMSM0,115200n8 earlycon=qcom_geni,uart earlyprintk debug ignore_loglevel initcall_debug androidboot.selinux=permissive"|' ../AnyKernel3/anykernel.sh
              fi
            fi

            cd ../AnyKernel3
            zip -r9 "../ginkgo-floppy-debug-kernel-$(date +%Y%m%d-%H%M).zip" . -x ".git*"
          fi

      - name: Upload build log (her zaman)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log

      - name: Upload flashable kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ginkgo-floppy-debug-kernel
          path: ginkgo-floppy-debug-kernel-*.zip
